<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estúdio - Unhas</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .galeria { display: flex; flex-wrap: wrap; gap: 10px; }
    .item { text-align: center; }
    .item img { cursor: pointer; width: 200px; height: 200px; object-fit: cover; border-radius: 8px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 10; }
    .modal.aberto { display: flex; }
    .modal img { width: 80%; max-width: 600px; cursor: pointer; }
    button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Olá, seja bem-vinda, diva!</h1>

  <!-- Produtos (gerados pelo JavaScript) -->
  <h2>Unhas</h2>
  <div class="galeria" id="produtos"></div>

  <!-- Carrinho -->
  <h2>Seu carrinho</h2>
  <ul id="carrinho"></ul>
  <p>Total: <strong id="total">R$ 0,00</strong></p>
  <button onclick="finalizar()">Finalizar pedido</button>
  <p id="mensagem"></p>

  <!-- Janela da imagem grande -->
  <div id="modal" class="modal" onclick="fecharFoto()">
    <img id="foto-media" src="" alt="Imagem ampliada">
  </div>

  <footer>
    <p>© Estúdio da Diva</p>
  </footer>

  <script>
    const produtos = [
      { id: 1, nome: "Molde F1",  preco: 25.00, foto: "moldef1.jpg" },
      { id: 2, nome: "Unha modelo 2", preco: 30.00, foto: "unha33.jpg" },
      { id: 3, nome: "Unha modelo 3", preco: 30.00, foto: "unha4.jpg" },
      { id: 4, nome: "Unha modelo 4", preco: 35.00, foto: "unha5.jpg" },
      { id: 5, nome: "Unha modelo 5", preco: 35.00, foto: "unhaa.jpg" }
    ];
    let carrinho = [];

    

    document.getElementById("produtos").innerHTML = produtos.map(p => `
      <div class="item">
        <img src="${p.foto}" alt="${p.nome}" onclick="abrirFoto('${p.foto}')">
        <p>${p.nome} - R$ ${p.preco.toFixed(2)}</p>
        <button onclick="adicionar(${p.id})">Adicionar</button>
      </div>`).join("");

    function adicionar(id) {
      carrinho.push(produtos.find(p => p.id === id));
      atualizar();
      document.getElementById("mensagem").textContent = "Item adicionado! 💅";
    }

    function atualizar() {
      document.getElementById("carrinho").innerHTML =
        carrinho.map(p => `<li>${p.nome} - R$ ${p.preco.toFixed(2)}</li>`).join("");
      const total = carrinho.reduce((s, p) => s + p.preco, 0);
      document.getElementById("total").textContent = "R$ " + total.toFixed(2);
    }

    function finalizar() {
      if (carrinho.length === 0) return alert("Carrinho vazio!");
      carrinho = [];
      atualizar();
      document.getElementById("mensagem").textContent = "Pedido confirmado! Obrigada 💖";
    }

    function abrirFoto(src) {
      document.getElementById("foto-media").src = src;
      document.getElementById("modal").classList.add("aberto");
    }
    function fecharFoto() {
      document.getElementById("modal").classList.remove("aberto");
    }
  </script>
  <script>
    const produtos = [
      { id: 1, nome: " cabelo",  preco: 25.00, foto: "moldef1.jpg" },
      { id: 2, nome: "Unha modelo 2", preco: 30.00, foto: "unha33.jpg" },
      { id: 3, nome: "Unha modelo 3", preco: 30.00, foto: "unha4.jpg" },
      { id: 4, nome: "Unha modelo 4", preco: 35.00, foto: "unha5.jpg" },
      { id: 5, nome: "Unha modelo 5", preco: 35.00, foto: "unhaa.jpg" }
    ];
    </script>
</body>
</html>
