    <a href="dados.html">
        <button type="button" onclick="window.location.href='formulario.html'">

   </button>

  

    <script>const dadosSalvos = localStorage.getItem("dadosUsuario");

    if (dadosSalvos) {

        const dados = JSON.parse(dadosSalvos);

        document.getElementById("dadosUsuario").innerHTML = `
            <p><strong>Nome:</strong> ${dados.nome}</p>
            <p><strong>Email:</strong> ${dados.email}</p>
            <p><strong>Telefone:</strong> ${dados.telefone}</p>
        `;

    } else {

        document.getElementById("dadosUsuario").innerHTML =
            "<p>Nenhum dado cadastrado ainda.</p>";

    }</script>

</body>
